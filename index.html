/* inline icons */
const ARR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const DL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>';
$$('.dlI').forEach(e=>e.innerHTML=DL);

/* faq list */
const chips=['','','⚠','','1002','1003','1004','1006','1007','2007'];
const faq=$('#faq'); let cur='ru';
chips.forEach((c,i)=>{
  const r=document.createElement('div');r.className='row';r.tabIndex=0;r.setAttribute('role','button');
  r.onclick=()=>openM(i);r.onkeydown=e=>{if(e.key==='Enter')openM(i)};
  if(!c)r.classList.add('nb');
  r.innerHTML=(c?'<div class="code'+(isNaN(c)?' sym':'')+'">'+c+'</div>':'')+'<div class="info"><h3></h3><p></p></div><div class="go">'+ARR+'</div>';
  faq.appendChild(r);
});

function applyLang(l){
  if(!T[l])return; cur=l; const t=T[l];
  $$('[data-t]').forEach(e=>{if(t[e.dataset.t]!==undefined)e.innerHTML=t[e.dataset.t]});
  $$('#faq .row').forEach((r,i)=>{r.querySelector('h3').textContent=t.f[i][0];r.querySelector('p').textContent=t.f[i][1]});
  $('#langBtn').textContent=l.toUpperCase();
  $$('.lo').forEach(o=>o.classList.toggle('active',o.dataset.lang===l));
  document.documentElement.lang=l;
  try{localStorage.setItem('gtr_lang',l)}catch(e){}
}
function selectLang(l){haptic();applyLang(l);closeL()}
function closeL(){langM.classList.remove('open')}
function openM(i){haptic();$('#mt').textContent=T[cur].f[i][0];$('#mb').innerHTML=T[cur].m[i];$('#modal').classList.add('open')}
function closeM(){haptic();$('#modal').classList.remove('open')}
function viewImg(e,src){e.preventDefault();e.stopPropagation();haptic();$('#vimg').src=src;$('#viewer').classList.add('open')}

/* tabs */
$$('.tab').forEach(b=>b.onclick=()=>{
  haptic();$$('video').forEach(v=>v.pause());
  $$('.section').forEach(s=>s.classList.remove('active'));
  $$('.tab').forEach(t=>t.classList.remove('active'));
  $('#'+b.dataset.s).classList.add('active');b.classList.add('active');
  $('#pill').style.transform='translateX('+(b.dataset.i*100)+'%)';
});

/* custom video player */
const I={play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
 vol:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 8.5a5 5 0 010 7l-1.2-1.2a3.3 3.3 0 000-4.6zM18.5 6a8.5 8.5 0 010 12l-1.2-1.2a6.8 6.8 0 000-9.6z"/></svg>',
 mute:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM15 9.5l1.4-1.4 2.1 2.1 2.1-2.1L22 9.5l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></svg>',
 fs:'<svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zM15 4h5v5h-2V6h-3zM18 15h2v5h-5v-2h3zM4 15h2v3h3v2H4z"/></svg>'};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
$$('.player').forEach(p=>{
  p.innerHTML='<video playsinline preload="metadata"></video><button class="big" aria-label="Play"><span>'+I.play+'</span></button>'+
   '<div class="bar"><button class="pb pp">'+I.play+'</button><span class="tm">0:00</span><input class="seek" type="range" min="0" max="1000" value="0"><span class="tm dur">0:00</span>'+
   '<button class="pb sp">1×</button><button class="pb mu">'+I.vol+'</button><button class="pb fs">'+I.fs+'</button></div>';
  const v=p.querySelector('video'),pp=p.querySelector('.pp'),sk=p.querySelector('.seek'),cu=p.querySelector('.tm'),du=p.querySelector('.dur'),sp=p.querySelector('.sp'),mu=p.querySelector('.mu');
  try{v.src=new URL(p.dataset.src,location.href).href}catch(e){v.src=encodeURI(p.dataset.src)}
  let idle,speeds=[1,1.5,2,.5],si=0;
  const wake=()=>{p.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>p.classList.add('idle'),2500)};
  const toggle=()=>{haptic();v.paused?v.play():v.pause()};
  p.querySelector('.big').onclick=toggle;pp.onclick=toggle;v.onclick=()=>{toggle();wake()};
  v.onplay=()=>{p.classList.add('playing');pp.innerHTML=I.pause;wake()};
  v.onpause=()=>{p.classList.remove('playing');pp.innerHTML=I.play};
  v.onloadedmetadata=()=>du.textContent=fmt(v.duration);
  v.ontimeupdate=()=>{cu.textContent=fmt(v.currentTime);if(v.duration){const x=v.currentTime/v.duration*1000;sk.value=x;sk.style.setProperty('--p',x/10+'%')}};
  sk.oninput=()=>{if(v.duration)v.currentTime=sk.value/1000*v.duration;sk.style.setProperty('--p',sk.value/10+'%')};
  sp.onclick=()=>{si=(si+1)%4;v.playbackRate=speeds[si];sp.textContent=speeds[si]+'×'};
  mu.onclick=()=>{v.muted=!v.muted;mu.innerHTML=v.muted?I.mute:I.vol};
  p.querySelector('.fs').onclick=()=>{
    if(document.fullscreenElement){document.exitFullscreen()}
    else if(p.requestFullscreen){p.requestFullscreen()}
    else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen()}
  };
  p.onmousemove=p.ontouchstart=wake;
});

let saved=null;try{saved=localStorage.getItem('gtr_lang')}catch(e){}
applyLang(saved&&T[saved]?saved:'ru');
