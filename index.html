  playClickSound();

  $$('.section').forEach(s=>s.classList.remove('active'));
  $$('.tab').forEach(t=>t.classList.remove('active'));
  const targetSection = document.getElementById(sectionName);
  if (targetSection) targetSection.classList.add('active');
  tabButton.classList.add('active');
  if (history.replaceState) {
      history.replaceState(null, null, '#' + encodeURIComponent(sectionName));
  } else {
      location.hash = encodeURIComponent(sectionName);
  }
}

$$('.tab').forEach(b=>{
  b.onclick = () => {
    activateTab(b.dataset.s, b);
  };
});

function handleInitialHash() {
  const rawHash = window.location.hash.replace('#', '');
  const hash = decodeURIComponent(rawHash);
  const defaultTab = document.querySelector('.tab[data-s="faq"]');
  
  if (hash) {
    const targetTab = document.querySelector(`.tab[data-s="${hash}"]`);
    if (targetTab) {
      activateTab(hash, targetTab);
    } else if (defaultTab) {
      activateTab('faq', defaultTab);
    }
  } else if (defaultTab) {
    activateTab('faq', defaultTab);
  }
}

window.addEventListener('load', handleInitialHash);
window.addEventListener('hashchange', handleInitialHash);

async function apiPost(path, body) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  return res.json();
}
function initData() { try { return (tg && tg.initData) || ''; } catch(e) { return ''; } }
async function logEvent(action) {
  try { if (!initData()) return; await apiPost('/api/log_event', { initData: initData(), action }); } catch(e) {}
}
async function checkAdmin() {
  try {
    if (!initData()) return;
    const data = await apiPost('/api/me', { initData: initData() });
    if (data.ok && data.isAdmin) addLogsTab();
    logEvent('открыл мини-апп');
  } catch(e) { console.warn('API недоступен:', e); }
}
function addLogsTab() {
  const dock = document.getElementById('dock');
  if (!dock || dock.querySelector('[data-s="logs"]')) return;
  dock.classList.add('admin');
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.dataset.i = '6';
  btn.dataset.s = 'logs';
  btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Логи</span>';
  btn.onclick = () => {
    activateTab('logs', btn);
    loadLogs();
  };
  dock.appendChild(btn);
}
async function loadLogs() {
  const box = document.getElementById('logList');
  box.innerHTML = '<div class="label">Загрузка...</div>';
  try {
    const data = await apiPost('/api/logs', { initData: initData(), limit: 200 });
    if (!data.ok) { box.innerHTML = '<div class="label">Ошибка доступа</div>'; return; }
    if (!data.events.length) { box.innerHTML = '<div class="label">Логов пока нет</div>'; return; }
    box.innerHTML = data.events.map(e =>
      `<div class="row static"><div class="info"><h3>${e.action}</h3><p>ID ${e.user_id} · @${e.username} · ${e.time}</p></div></div>`
    ).join('');
  } catch(e) { box.innerHTML = '<div class="label">Ошибка сети</div>'; }
}

window.addEventListener('beforeunload', () => { logEvent('закрыл мини-апп'); });
let saved=null;try{saved=localStorage.getItem('gtr_lang')}catch(e){}
applyLang(saved&&T[saved]?saved:'ru');
checkAdmin();
</script>
